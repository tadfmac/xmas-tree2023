<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">
<meta name="description" content="Tree Test">
<title>Tree Test</title>
<style>
*{
  margin:0px;
  padding:0px;
  box-sizing: border-box;
}
html,body {
  height: 100%;
  margin: 0;
  background-color:gray;
}
#svgWrap{
  width:90%;
  height:90%;
  overflow:hidden;
  display:flex;
  justify-content: center;
  align-items: center;
}
.treewrap{
  width:80%;
  height:80%;
/*  overflow:hidden; */
  display:flex;
  justify-content: center;
  align-items: center;
}
#treewrap > svg{
  width:100%;
  height:100%;
  display:block;
}
#aWrap{
  width:100%;
  height:100%;
  display:flex;
  justify-content: center;
  align-items: center;
}

</style>
</head>
<body>
<div id="aWrap">
  <div id="svgWrap"></div>
</div>
<script type="module">
///////////////////////////////////////////////////////////////////////
// for Tree
const $svgWrap = document.querySelector("#svgWrap");

import Tree from "./tree.mjs";
let tree = new Tree($svgWrap);
tree = await tree.init();

let color = 0;
let val10 = 0;
let val1 = 0;
let devices = null;

let onchange = (_devices) =>{
  devices = _devices;
};
tree.setOnChange(onchange);

setInterval(async ()=>{
  if(devices != null){
    for(let cnt=0;cnt<devices.length;cnt++){
      let did = devices[cnt].did;
      let v10 = (val10+cnt)%4;
      tree.send(did,color,v10,val1);
    }
  }
  color++;
  color %= 7;
  val1++;
  val1 %= 8;
  if(val1 == 7){
    val10++;
    val10 %= 4;
  }
  await tree.wait(300);
  tree.clearAll(null);

},500);

</script>  
</body>
</html>
